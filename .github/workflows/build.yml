name: Build Android & iOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable

      - run: flutter pub get

      - name: Set release version
        id: release
        shell: bash
        run: |
          VERSION="1.1.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - run: flutter build apk --release --build-name "${{ steps.release.outputs.version }}" --build-number "${{ steps.release.outputs.build_number }}"
      - run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/RankRocket AI.apk"

      - name: Register generated release
        if: ${{ env.LICENSE_RELEASE_TOKEN != '' }}
        env:
          LICENSE_RELEASE_TOKEN: ${{ secrets.LICENSE_RELEASE_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body -X POST "${LICENSE_SERVER_URL:-https://ai.rankrocket.online}/api/v1/releases" \
            -H "Authorization: Bearer $LICENSE_RELEASE_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"version":"${{ steps.release.outputs.version }}","build_number":"${{ steps.release.outputs.build_number }}","platform":"android","commit":"${GITHUB_SHA}","workflow_run":"${GITHUB_RUN_ID}"}'

      - uses: actions/upload-artifact@v4
        with:
          name: RankRocket AI.apk
          path: build/app/outputs/flutter-apk/RankRocket AI.apk

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable

      - run: flutter pub get

      - name: Set release version
        id: release
        shell: bash
        run: |
          VERSION="1.1.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - run: flutter build ios --no-codesign --build-name "${{ steps.release.outputs.version }}" --build-number "${{ steps.release.outputs.build_number }}"

      - name: Register generated release
        if: ${{ env.LICENSE_RELEASE_TOKEN != '' }}
        env:
          LICENSE_RELEASE_TOKEN: ${{ secrets.LICENSE_RELEASE_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body -X POST "${LICENSE_SERVER_URL:-https://ai.rankrocket.online}/api/v1/releases" \
            -H "Authorization: Bearer $LICENSE_RELEASE_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"version":"${{ steps.release.outputs.version }}","build_number":"${{ steps.release.outputs.build_number }}","platform":"ios","commit":"${GITHUB_SHA}","workflow_run":"${GITHUB_RUN_ID}"}'

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
